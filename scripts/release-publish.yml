# .github/workflows/publish.yml for Freedom-Launcher/releases (added there once, by hand:
# the GitHub integration may not write workflow files). scripts/release-push.sh pushes
# the build to the `staging` branch; this job turns it into Release v<version>.
# Re-runnable: existing assets with the same names are removed before upload.
name: publish
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -eu
          VER=$(jq -r .version latest.json)
          TAG="v$VER"
          if ! gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
            jq -r .notes latest.json > notes.md
            gh release create "$TAG" -R "$R" --target main --title "Freedom Launcher $VER" --notes-file notes.md
          fi
          FILES="Freedom-Launcher_${VER}_x64-setup.exe Freedom-Launcher_${VER}_x64-setup.exe.sig latest.json"
          EXISTING=$(gh release view "$TAG" -R "$R" --json assets -q '.assets[].name')
          for f in $FILES; do
            if printf '%s\n' "$EXISTING" | grep -qxF "$f"; then
              gh release delete-asset "$TAG" "$f" -R "$R" -y
            fi
          done
          for i in 1 2 3; do
            gh release upload "$TAG" -R "$R" --clobber $FILES && break
            [ "$i" = 3 ] && exit 1
            sleep 10
          done
          gh release edit "$TAG" -R "$R" --draft=false --latest
          gh api -X DELETE "repos/$R/git/refs/heads/staging" || true