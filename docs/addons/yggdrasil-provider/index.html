<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <script src="fl-sdk.js"></script>
  <script src="config.js"></script>
  <script src="main.js" defer></script>
</head>
<body>
  <h3 id="title"></h3>
  <ul id="accounts"></ul>
  <!-- Not a form element: plugin frames are sandboxed without allow-forms, so a form would never submit. -->
  <div id="form" class="form">
    <label><span id="l-login"></span><input id="login" maxlength="254" autocomplete="username"></label>
    <label><span id="l-pass"></span><input id="pass" type="password" maxlength="256" autocomplete="current-password"></label>
    <label id="code-row" hidden><span id="l-code"></span><input id="code" inputmode="numeric" maxlength="12" autocomplete="one-time-code"></label>
    <button id="go" type="button"></button>
  </div>
  <p id="msg" role="status"></p>
</body>
</html>
