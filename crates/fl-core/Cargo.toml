[package]
name = "fl-core"
description = "Freedom Launcher core: action bus, permissions, accounts, versions, instances"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "process", "io-util", "rt"] }
reqwest.workspace = true
uuid.workspace = true
md5.workspace = true
sha1.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
zip.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }
