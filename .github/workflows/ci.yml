name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p fl-core -- -D warnings
      - run: cargo test -p fl-core

  ui:
    # Theme templates (shell, Settings, every screen) mounted against the real index.html.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save jsdom
      - run: node scripts/ui-mount-test.js
      - run: node scripts/yggdrasil-plugin-test.js
      - run: node scripts/ui-plugins-catalog-test.js
      - run: node scripts/ui-plugins-updates-test.js
      - run: node scripts/ui-plugins-dev-test.js
      - run: node scripts/ui-doctor-test.js
      - run: node --check ui/app.js && node --check ui/themes.js && node --check ui/addons.js

  app:
    needs: [core, ui]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo build -p freedom-launcher --release