<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="stats.css">
  <script src="fl-sdk.js"></script>
  <script src="stats.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Время в игре</h1>
      <p id="sub" class="muted">…</p>
    </header>
    <section class="cards" id="cards"></section>
    <section class="panel">
      <h2>Последние 14 дней</h2>
      <div id="chart" class="chart"></div>
      <p id="hint" class="muted small" hidden></p>
    </section>
    <section class="panel">
      <h2>По сборкам</h2>
      <div id="bars"></div>
    </section>
    <section class="panel">
      <h2>Последние запуски</h2>
      <ol id="recent" class="recent"></ol>
    </section>
  </main>
</body>
</html>
